spring.application.name=core

spring.ai.openai.base-url=https://integrate.api.nvidia.com
spring.ai.openai.api-key=${NVIDIA_API_KEY}
spring.ai.openai.chat.options.model=mistralai/mistral-small-4-119b-2603
spring.ai.openai.chat.options.temperature=0.1
spring.ai.openai.chat.options.max-tokens=2048

spring.ai.openai.embedding.base-url=https://api.mistral.ai
spring.ai.openai.embedding.api-key=${MISTRAL_API_KEY}
spring.ai.openai.embedding.options.model=mistral-embed

spring.datasource.url=${DB_URL:jdbc:postgresql://db.luhsituetbskxmsxvrrf.supabase.co:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1024

supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}